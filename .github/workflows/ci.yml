name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # postinstall runs `prisma generate`. Dummy URLs satisfy schema env reads;
        # unit tests / lint do not open a real database.
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

      - name: Lint
        # Fails on ESLint errors. Known noisy react-hooks rules are warnings in
        # eslint.config.mjs until a product cleanup lands.
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

      # Intentionally no `pnpm build` / `next build` here: production build needs
      # real NEXT_PUBLIC_* / Supabase / OpenAI values. Unit tests + lint are the
      # merge bar. Dummy public placeholders (if a future job adds build):
      #   NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
      #   NEXT_PUBLIC_SUPABASE_ANON_KEY=public-anon-key
      # Typecheck (`tsc --noEmit`) is skipped: main currently has unrelated TS
      # errors (DOM lib / services workspace) that need a separate cleanup.
      - name: Unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

  build-smoke:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key

      - name: Smoke start
        timeout-minutes: 2
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key
        run: |
          set -euo pipefail
          timeout 60 bash -c '
            pnpm start &
            pid=$!
            cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
            trap cleanup EXIT
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://127.0.0.1:3000/login || curl -sf -o /dev/null http://127.0.0.1:3000/; then
                echo "smoke ok"
                exit 0
              fi
              sleep 1
            done
            echo "smoke failed: app did not respond"
            exit 1
          '
