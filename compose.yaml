# Local dual-container stack for competition / Render split rehearsal.
# Does NOT deploy anywhere — Vercel production is unchanged until you wire the API.
# Project name comes from the directory (or COMPOSE_PROJECT_NAME) so parallel worktrees do not collide.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3001}:3001"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      PORT: '3001'
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
